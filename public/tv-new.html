<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navbat ekrani (yangi) — Davr Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/tv-new.css" />
    <link rel="icon" href="/img/logo.jpg" />
  </head>
  <body class="tvn">
    <div class="tvn-flash" id="flash"></div>
    <div class="tvn-wrap">
      <header class="tvn-head">
        <div class="tvn-brand">
          <img src="/img/logo.jpg" alt="Davr Bank" />
          <div><b>Davr Bank</b><span>Uchtepa filiali · Navbat tizimi</span></div>
          <span class="tvn-live"><i id="liveDot"></i>Jonli</span>
        </div>
        <div class="tvn-right">
          <button class="tvn-btn" id="soundToggle">🔊 Signal</button>
          <div class="tvn-time">
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">—</div>
          </div>
        </div>
      </header>

      <main class="tvn-main">
        <section class="tvn-hero" id="hero">
          <div class="hero-label">Hozir chaqirilmoqda</div>
          <div class="hero-code" id="heroCode">—</div>
          <div class="hero-go">
            <span class="arrow">➜</span>
            <span class="hero-op" id="heroOp">Kuting</span>
          </div>
          <div class="hero-svc" id="heroSvc"></div>
        </section>

        <aside class="tvn-board">
          <h2>Operatorlar</h2>
          <div class="board-list" id="board"></div>
        </aside>
      </main>

      <section class="tvn-next">
        <div class="next-title">
          <b>Keyingilar</b>
          <span id="nextCount">0 kishi kutmoqda</span>
        </div>
        <div class="next-strip" id="next"></div>
      </section>
    </div>
    <div class="offline-banner" id="offline">Server bilan aloqa uzildi — qayta ulanmoqda…</div>
    <script src="/common.js"></script>
    <script src="/tv-new.js"></script>
  </body>
</html>
