<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navbat ekrani — Davr Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/tv.css" />
    <link rel="icon" href="/img/logo.jpg" />
  </head>
  <body class="tvn tvd hdr-glass">
    <div class="tvn-flash" id="flash"></div>
    <!-- Keeps the TV awake: a TV counts a page that is playing video as "in use", so its
         screensaver / sleep timer never starts. Silent, 4 px, bottom-right corner. -->
    <video id="keepAwake" class="tvn-keepawake" muted loop playsinline autoplay preload="auto" aria-hidden="true" tabindex="-1">
      <source src="/video/keepawake.mp4" type="video/mp4" />
      <source src="/video/keepawake.webm" type="video/webm" />
    </video>
    <div class="tvn-wrap">
      <header class="tvn-head">
        <span class="tvn-live"><i id="liveDot"></i>Jonli</span>
        <div class="tvn-brand">
          <img src="/img/logo.jpg" alt="Davr Bank" />
          <div><b>Davr Bank</b><span>Uchtepa filiali · Navbat tizimi</span></div>
        </div>
        <div class="tvn-right">
          <div class="tvn-voice">
            <button class="tvn-btn" id="soundToggle">🔊 Signal</button>
            <button class="tvn-btn" id="modeToggle" title="Chaqiruv: ovoz yoki qo'ng'iroq">🗣️ Ovoz</button>
            <button class="tvn-btn" id="soundTest" title="Signalni sinash">🔔 Sinash</button>
            <!-- Hidden for now (per request) — functionality kept for when a good
                 Uzbek voice is found; remove "hidden" to show these again. -->
            <select class="tvn-btn" id="voiceSelect" title="Chaqiruv ovozi" hidden>
              <option value="">🗣️ Ovoz: tanlanmagan</option>
            </select>
            <button class="tvn-btn" id="voiceTest" title="Ovozda o'qishni sinash" hidden>▶️ Ovozni sinash</button>
          </div>
          <div class="tvn-time">
            <div class="clock" id="clock">00:00:00</div>
            <div class="date" id="date">—</div>
          </div>
        </div>
      </header>

      <main class="tvd-main">
        <div class="tvd-vwrap" id="vwrap"></div>
        <div class="tvd-grid" id="grid"></div>
      </main>

      <section class="tvn-next">
        <div class="next-title">
          <b>Keyingilar</b>
          <span id="nextCount">0 kishi kutmoqda</span>
        </div>
        <div class="next-strip" id="next"></div>
      </section>
    </div>
    <div class="tvn-toast" id="voiceToast"></div>
    <div class="offline-banner" id="offline">Server bilan aloqa uzildi — qayta ulanmoqda…</div>
    <script src="/common.js"></script>
    <script src="/tv-voice.js"></script>
    <script src="/tv.js"></script>
  </body>
</html>
