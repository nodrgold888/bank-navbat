<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navbat ekrani — Davr Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/img/logo.jpg" />
  </head>
  <body class="tv">
    <div class="tv-boom" id="tvBoom"></div>
    <div class="tv-wrap">
      <header class="tv-head">
        <div class="title">
          <img class="brand-logo" src="/img/logo.jpg" alt="Davr Bank" /> Davr Bank navbat tizimi
          <span class="tv-live"><span class="live-dot" id="liveDot"></span>Jonli</span>
        </div>
        <div class="right">
          <div class="voice-controls">
            <button class="sound-toggle" id="soundToggle">🔊 Signal: yoniq</button>
            <button class="sound-toggle" id="soundTest" title="Signalni sinash">🔔 Sinash</button>
            <select class="sound-toggle" id="voiceSelect" title="Chaqiruv ovozi">
              <option value="">🗣️ Ovoz: tanlanmagan</option>
            </select>
            <button class="sound-toggle" id="voiceTest" title="Ovozda o'qishni sinash">▶️ Ovozni sinash</button>
          </div>
          <div>
            <div class="clock tabnum" id="clock">00:00:00</div>
            <div class="date" id="date">—</div>
          </div>
        </div>
      </header>

      <div class="tv-body">
        <section class="now-serving">
          <h2>Operatorlar</h2>

          <div class="valyuta-wrap" id="valyutaWrap"></div>

          <div class="op-grid" id="opGrid"></div>
        </section>

        <aside class="waiting-panel">
          <h2>Navbatdagilar</h2>
          <div class="waiting-list" id="waitingList"></div>
        </aside>
      </div>

      <footer class="tv-foot">
        <div class="tvf-branch">
          "DAVR BANK" XATB UCHTEPA FILIALI · Yagona axborot xizmati:
          <b>1284</b>
          <span class="tvf-credit">· Developed by Bahodirov Nodirjon, AbuZarr Abdumuminov and Rustamov Shahboz</span>
        </div>
      </footer>
    </div>

    <div class="offline-banner" id="offline">Server bilan aloqa uzildi — qayta ulanmoqda…</div>
    <div class="toast" id="voiceToast"></div>

    <script src="/common.js"></script>
    <script src="/tv.js"></script>
  </body>
</html>
